# ============================================================================
# Mntis (Emotion Recognition Platform) — Docker Compose
# ============================================================================
# Quick start:
#   docker compose up --build
#
# All services use their internal hostnames (postgres, redis, kafka, minio,
# storage, orchestrator) which match the defaults in each service's Config.
#
# Env vars in this file match what the code actually reads.
# ============================================================================

services:

  # ──────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: emotion-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emotion_dev}
      # init script creates per-service databases below
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emotion}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotion-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: emotion-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotion-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: emotion-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - emotion-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: emotion-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Single PLAINTEXT listener for all internal traffic
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760      # 10 MB (base64 crops can be large)
      KAFKA_MAX_REQUEST_SIZE: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emotion-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: emotion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emotion-net
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: emotion-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb local/$${S3_BUCKET} --ignore-existing;
        echo 'Bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-emotion}
    networks:
      - emotion-net

  # ──────────────────────────────────────────────────────────────────────
  # API Services
  # ──────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../EmotionRecognitionGateway
      dockerfile: Dockerfile
    container_name: emotion-gateway
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emotion_dev}
      GATEWAY_DB: gateway_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORCHESTRATOR_URL: http://orchestrator:8001
      STORAGE_SERVICE_URL: http://storage:8002
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-dev-key-change-in-prod}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-500}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-60}
      UPLOAD_RATE_WINDOW_SECONDS: ${UPLOAD_RATE_WINDOW_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mntis.app,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
      storage:
        condition: service_started
    networks:
      - emotion-net
    restart: unless-stopped

  orchestrator:
    build:
      context: ../EmotionRecognitionOrchestrator
      dockerfile: Dockerfile
    container_name: emotion-orchestrator
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emotion_dev}
      ORCHESTRATOR_DB: orchestrator_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORCHESTRATOR_GROUP_ID: orchestrator
      MEDIA_TASKS_TOPIC: media_tasks
      MEDIA_RESULTS_TOPIC: media_results
      INFERENCE_TASKS_TOPIC: inference_tasks
      INFERENCE_RESULTS_TOPIC: inference_results
      BURN_TASKS_TOPIC: burn_tasks
      BURN_RESULTS_TOPIC: burn_results
      STORAGE_SERVICE_URL: http://storage:8002
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-dev-key-change-in-prod}
      WS_MAX_FRAME_SIZE: ${WS_MAX_FRAME_SIZE:-2097152}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      storage:
        condition: service_started
    networks:
      - emotion-net
    restart: unless-stopped

  storage:
    build:
      context: ../EmotionRecognitionStorage
      dockerfile: Dockerfile
    container_name: emotion-storage
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emotion_dev}
      STORAGE_DB: storage_db
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://mntis.app/s3}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-emotion}
      S3_REGION: ${S3_REGION:-us-east-1}
      PRESIGN_UPLOAD_TTL_SECONDS: ${PRESIGN_UPLOAD_TTL_SECONDS:-900}
      PRESIGN_DOWNLOAD_TTL_SECONDS: ${PRESIGN_DOWNLOAD_TTL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - emotion-net
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Workers (no port — Kafka consumers)
  # ──────────────────────────────────────────────────────────────────────
  media-worker:
    build:
      context: ../EmotionRecognitionMedia
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MEDIA_TASKS_TOPIC: media_tasks
      MEDIA_RESULTS_TOPIC: media_results
      MEDIA_GROUP_ID: media-workers
      WORKER_ID: media-worker-${HOSTNAME:-1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-emotion}
      S3_REGION: ${S3_REGION:-us-east-1}
      STORAGE_SERVICE_URL: http://storage:8002
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      storage:
        condition: service_started
    networks:
      - emotion-net
    restart: unless-stopped

  inference-worker:
    build:
      context: ../EmotionRecognitionInference
      dockerfile: Dockerfile.cpu     # change to Dockerfile (GPU) if available
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFERENCE_TASKS_TOPIC: inference_tasks
      INFERENCE_RESULTS_TOPIC: inference_results
      INFERENCE_GROUP_ID: inference-workers
      WORKER_ID: inference-worker-${HOSTNAME:-1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_PATH: /models/multi_stream_emotion.pt
      DEVICE: ${DEVICE:-cpu}
      NUM_CLASSES: 7
      INFERENCE_BATCH_SIZE: 1
    volumes:
      # Mount your trained model in here. Replace ./models with the
      # actual folder on the host that contains multi_stream_emotion.pt
      - ./models:/models:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emotion-net
    restart: unless-stopped

  burner:
    build:
      context: ../EmotionRecognitionBurner
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BURN_TASKS_TOPIC: burn_tasks
      BURN_RESULTS_TOPIC: burn_results
      BURN_GROUP_ID: burner-workers
      WORKER_ID: burner-${HOSTNAME:-1}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-emotion}
      S3_REGION: ${S3_REGION:-us-east-1}
      STORAGE_SERVICE_URL: http://storage:8002
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      storage:
        condition: service_started
    networks:
      - emotion-net
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Frontend + Edge
  # ──────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../emotion-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mntis.app/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://mntis.app/ws}
    container_name: emotion-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mntis.app/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://mntis.app/ws}
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - emotion-net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: emotion-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
      - orchestrator
      - frontend
    networks:
      - emotion-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  minio_data:

networks:
  emotion-net:
    driver: bridge