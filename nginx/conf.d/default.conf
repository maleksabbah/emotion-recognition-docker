# ============================================================================
# Mntis — public routing
#
#   /api/*          → gateway:8000  (auth, sessions, uploads)
#   /ws/live        → orchestrator:8001  (WebSocket live mode)
#   /internal/*     → 403 (storage internal API never exposed publicly)
#   everything else → frontend:3000
#
# For TLS, add a second `server` block on port 443 with `ssl_certificate` lines
# (e.g. from Let's Encrypt) and redirect plain HTTP. Keeping unencrypted here
# so it works for first-boot/local dev. Add HTTPS before public traffic.
# ============================================================================

server {
    listen 80 default_server;
    server_name _;

    # Hard-block storage's internal admin API at the edge.
    # Storage's /internal/* is for service-to-service calls only.
    location /internal/ {
        return 403;
    }

    # API → gateway
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Tighter limit specifically on upload endpoint
    location = /api/upload/request {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → orchestrator
    location /ws/ {
        limit_req zone=ws burst=20 nodelay;
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;   # long-lived WS connections
        proxy_send_timeout  3600s;
    }

    # Health check passthrough (uncomment if you want it public)
    # location = /health { proxy_pass http://gateway/health; }

    # Frontend (catches everything else, including /)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}