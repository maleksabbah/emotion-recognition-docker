# =====================================================================
# Mntis nginx — terminates TLS for mntis.app, proxies to gateway+frontend
# =====================================================================
#  :80  → redirects all traffic to :443 (except /.well-known for renewals)
#  :443 → serves the app + /api + /ws over HTTPS
# =====================================================================

# ── HTTP : redirect to HTTPS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mntis.app www.mntis.app;

    # Let's Encrypt renewals (if you switch to --webroot later)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS : real server ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mntis.app www.mntis.app;

    ssl_certificate     /etc/nginx/certs/live/mntis.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/mntis.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 100M;

    # ── /api → gateway ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── /ws → gateway (WebSocket upgrade) ────────────────────────────
    location /ws/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── /health (no rewrite) ─────────────────────────────────────────
    location /health {
        proxy_pass http://gateway;
    }

    # ── everything else → frontend ───────────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}