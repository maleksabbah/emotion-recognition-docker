server {
    listen 80;
    server_name _;

    # ── API routes → FastAPI Gateway ──────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (video processing)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Upload routes (stricter rate limit) ───────────
    location /api/sessions {
        limit_req zone=upload burst=5 nodelay;

        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large uploads
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ── WebSocket → Gateway /ws/* ─────────────────────
    location /ws/ {
        limit_req zone=ws burst=5 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeout — keep alive for live sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health check (no rate limit) ──────────────────
    location /health {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
    }

    # ── Frontend (React build served by Nginx) ────────
    # Uncomment when you have a React build:
    # location / {
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }

    # For now, proxy root to gateway too
    location / {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}