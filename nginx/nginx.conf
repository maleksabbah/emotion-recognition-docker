worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # File upload limits (video uploads can be large)
    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

    # Upstream definitions — named so proxy_pass can omit ports
    upstream gateway {
        server gateway:8000;
    }
    upstream frontend {
        server frontend:3000;
    }
    # The orchestrator owns the live-mode WebSocket (/ws/live). Nginx
    # used to send /ws/* to gateway, which 404'd — gateway doesn't host
    # WebSocket routes. Add the upstream here so the site conf can route
    # WS traffic to the right service.
    upstream orchestrator {
        server orchestrator:8001;
    }

    include /etc/nginx/conf.d/*.conf;
}